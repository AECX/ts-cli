name: C++ Formatting Check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: Check C++ formatting
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format 23.1.5
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==23.1.5"

      - name: Verify clang-format version
        shell: bash
        run: |
          set -euo pipefail

          clang-format --version

          version="$(clang-format --version)"
          if [[ "$version" != *"23.1.5"* ]]; then
            echo "::error::Expected clang-format 23.1.5, got: $version"
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t files < <(
            git ls-files -z -- '*.cpp' '*.hpp'
          )

          echo "Checking ${#files[@]} C++ files..."

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ files found."
            exit 0
          fi

          failed=0

          for file in "${files[@]}"; do
            if ! clang-format --style=file --dry-run --Werror "$file"; then
              echo "::error file=$file::Formatting violations found"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Formatting check failed."
            echo "Run clang-format 23.1.5 locally to fix the affected files."
            exit 1
          fi

          echo "All ${#files[@]} C++ files are correctly formatted."
